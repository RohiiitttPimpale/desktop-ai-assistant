<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: ws://localhost:* http://localhost:*; worker-src 'self' blob:"
    />
    <title>AI Companion</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, 'Segoe UI', sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #bubble {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 88%;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(24, 20, 38, 0.9);
        border: 1px solid rgba(139, 92, 246, 0.4);
        color: #f2eefc;
        font-size: 12.5px;
        line-height: 1.4;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        white-space: pre-line;
      }
      #bubble[hidden],
      #hint[hidden] {
        display: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        max-width: 88%;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(24, 20, 38, 0.85);
        color: #d8d0ec;
        font-size: 11px;
        text-align: center;
        pointer-events: none;
      }
      #chat-form {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        width: 88%;
        display: flex;
        gap: 6px;
      }
      #chat-input {
        flex: 1;
        padding: 7px 11px;
        border-radius: 16px;
        border: 1px solid rgba(139, 92, 246, 0.5);
        background: rgba(18, 15, 28, 0.88);
        color: #fff;
        font-size: 12px;
        outline: none;
      }
      #chat-input:focus {
        border-color: #a78bfa;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="bubble" hidden></div>
    <div id="hint" hidden></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask Miko... (e.g. open notepad)" autocomplete="off" />
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
